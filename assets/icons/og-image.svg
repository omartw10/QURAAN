<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1800"/>
      <stop offset="100%" stop-color="#0f0900"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b84a"/>
      <stop offset="100%" stop-color="#945600"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle decorative background elements -->
  <circle cx="600" cy="315" r="450" fill="none" stroke="#382100" stroke-width="2"/>
  <circle cx="600" cy="315" r="300" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="315" r="150" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.1"/>
  
  <!-- Mosque Dome & Quran Icon (scaled up and centered) -->
  <g transform="translate(500, 110) scale(0.4)">
    <path d="M256 140 C160 200 140 280 140 400 L372 400 C372 280 352 200 256 140 Z" fill="url(#gold)"/>
    <path d="M256 70 A 24 24 0 1 0 276 100 A 20 20 0 1 1 256 70 Z" fill="url(#gold)"/>
    <path d="M256 360 C180 330 150 350 150 350 L150 250 C180 230 256 260 256 260 C256 260 332 230 362 250 L362 350 C362 350 332 330 256 360 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M256 260 L256 360" stroke="#7a4700" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="600" y="420" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="12">QURAAN</text>
  <text x="600" y="480" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="32" font-weight="300" fill="#e6b84a" text-anchor="middle" letter-spacing="6">A JOURNEY OF GUIDANCE</text>
  
  <!-- Footer -->
  <text x="600" y="580" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="3">Listen &amp; Watch Live Stream</text>
